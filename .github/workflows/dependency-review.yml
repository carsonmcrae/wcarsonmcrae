# Purpose: Block pull requests that add dependencies with known high-severity vulnerabilities.
# Scope: Manifest and lockfile changes in pull requests. It runs on every pull request (and passes at
#   once when no dependency changed) so it can be a required check.
# Does NOT belong: Full audits of the installed tree (the security job in ci.yml).
# Copyright (c) 2026 William Carson McRae. All rights reserved.
# SPDX-License-Identifier: LicenseRef-Daysforth-Restricted
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
