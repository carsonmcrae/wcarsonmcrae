# Purpose: The quality gate for every pull request, and the first stage of every deployment.
# Scope: Static checks (format, lint, line limits, headers, asset sizes, duplication, unused code,
#   types), unit tests at 100% per-file coverage, the built site at the domain root and under the
#   GitHub Pages project path, browser tests with axe in desktop Chromium, mobile Chromium, and mobile
#   WebKit, and security (npm audit, registry signatures, gitleaks, Semgrep, Trivy). One aggregate "Validate" job is
#   the check to require in branch protection.
# Does NOT belong: Publishing (deploy.yml calls this workflow first) or CodeQL (codeql.yml).
# Copyright (c) 2026 William Carson McRae. All rights reserved.
# SPDX-License-Identifier: LicenseRef-Daysforth-Restricted
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-deps
      - run: npm run format:check
      - run: npm run lint
      - name: Line limits, file headers, and asset sizes
        run: npm run check:repo
      - name: Release and architecture consistency
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: npm run check:release
      - name: Copy-paste detection (jscpd)
        run: npm run check:duplicates
      - name: Unused files, exports, and dependencies (Knip)
        run: npm run check:unused
      - run: npm run typecheck

  unit:
    name: Unit tests (100% coverage per file)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-deps
      - run: npm run test:coverage

  build:
    name: Built site (root and project path)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-deps
      - run: npm run build
      - run: npm run test:build
      - run: npm run test:build:subpath

  e2e:
    name: Browser and accessibility tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUBLIC_REACTIONS_URL: https://reactions.daysforth.test
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-deps
      - name: Install Chromium and WebKit
        run: |
          # Avoid the repeatedly throttled Azure mirror; apt still verifies Ubuntu signatures.
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Security audits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-deps
      - name: npm audit (production dependencies, high and above)
        run: npm run security:audit
      - name: Registry signatures and provenance
        run: npm audit signatures
      - name: Gitleaks (checksum-verified download)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
          # A pull request is judged on its own commits; anything else scans the whole history.
          if [ -n "$BASE" ]; then range="$BASE..HEAD"; else range=""; fi
          ./gitleaks git --redact --no-banner --config .gitleaks.toml ${range:+--log-opts="$range"} .

  semgrep:
    name: Semgrep source security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan first-party code with the pinned community engine
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src \
            semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 \
            sh -c 'git config --global --add safe.directory /src && semgrep scan --config p/security-audit --config p/typescript --config p/javascript --config p/github-actions --metrics off --disable-version-check --error'

  trivy:
    name: Trivy dependency and secret security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan every dependency tier, source secrets, and supported configuration
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln,misconfig,secret --include-dev-deps --skip-version-check \
            --skip-dirs .git --exit-code 1 /src

  validate:
    name: Validate
    if: always()
    needs: [static, unit, build, e2e, security, semgrep, trivy]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.e2e.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
        run: |
          [ "$STATIC_RESULT" = success ] && [ "$UNIT_RESULT" = success ] \
            && [ "$BUILD_RESULT" = success ] && [ "$BROWSER_RESULT" = success ] \
            && [ "$SECURITY_RESULT" = success ] && [ "$SEMGREP_RESULT" = success ] \
            && [ "$TRIVY_RESULT" = success ]
