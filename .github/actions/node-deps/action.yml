# Purpose: Install Node (the version in .nvmrc, with the npm cache) and the locked npm dependencies.
# Scope: Shared by every workflow job that runs npm scripts; the job checks out the repository first.
# Does NOT belong: Browser installation or job-specific steps (the calling workflow).
# Copyright (c) 2026 William Carson McRae. All rights reserved.
# SPDX-License-Identifier: LicenseRef-Daysforth-Restricted
name: Node and npm dependencies
description: Set up Node from .nvmrc with the npm cache, then run npm ci.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
