# Purpose: Free-tier deployment configuration for Daysforth shared reactions.
# Scope: Worker entry, D1 binding, allowed browser origins, and rate-limit cleanup.
# Does NOT belong: Secrets (set RATE_LIMIT_SALT with wrangler secret put) or site hosting.
name = "daysforth-reactions"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = false

[vars]
ALLOWED_ORIGINS = "https://daysforth.com,https://www.daysforth.com,https://wcarsonmcrae.com,https://www.wcarsonmcrae.com,https://carsonmcrae.github.io,http://127.0.0.1:4322,http://localhost:4322"

[[d1_databases]]
binding = "DB"
database_name = "daysforth-reactions"
# Configure the real free D1 database before deploying.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["17 * * * *"]
