# Purpose: Secret-scanning configuration for gitleaks (run by the security job in ci.yml).
# Scope: gitleaks' default rules plus a narrow allow-list for known non-secrets: the lockfile's
#   integrity hashes and the literal consent-storage name, which are public and grant no access.
# Does NOT belong: Broad path ignores. Add an exact pattern with a reason instead.
# Copyright (c) 2026 William Carson McRae. All rights reserved.
# SPDX-License-Identifier: LicenseRef-Daysforth-Restricted
title = "wcarsonmcrae gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Lockfile checksums and the literal daysforth.consent.v1 localStorage name are public, not credentials."
paths = ['''(^|/)package-lock\.json$''']
regexTarget = "secret"
regexes = ['''^daysforth\.consent\.v1$''']
