# Purpose: Configure complete first-party source analysis on the local SonarQube instance.
# Scope: Repository-wide source files, separately classified tests, and real Vitest LCOV input.
# Does NOT belong: Authentication tokens, coverage/duplication exclusions, or generated reports.
sonar.projectKey=daysforth
sonar.projectName=Daysforth
sonar.host.url=http://127.0.0.1:9000
sonar.sourceEncoding=UTF-8

# Starting at the root includes src, scripts, workers, public, docs, workflows, and root configs.
# Git-ignored dependencies, generated build/test reports, and local state remain ignored by SCM.
sonar.sources=.
sonar.tests=tests
# Test classification also prevents indexing these files a second time as production source.
sonar.test.inclusions=tests/**

# Generate this report with npm run test:coverage before scanning; do not synthesize coverage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Supply sonar.projectVersion from package.json at invocation time to keep one version source.
